<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon">
    <title>EnvioAP | Varias AP's</title>
</head>
<body>
    <main>
        <section class="container">
            <section class="header-container"> 
                <span>EnvioAP</span>
                <img src="../assets/img/workon-logo.png" alt="logo workon">
             </section>

             <section class="content-container">
                <section class="tutorial">
                    <section class="tutorial-text">
                        <h1>Como enviar varias AP's?</h1>
                        <ol>
                            <li>Baixe o modelo de exportação;</li>
                            <li>Coloque as informações dos seus processos de acordo com o nome das colunas;</li>
                            <li>Olhe a lista de comentários para utilizar o correto;</li>
                            <li>Salve a planilha e importe aqui ao lado.</li>
                        </ol>
                    </section>
                    <a href=""><img src="../assets/img/icon-excel-min.png" alt="Ícone do Excel">Baixar o modelo de Importação</a>    
                </section>
                <section class="import-excel">
                     <label class="hidden-label">Excel</label>
                    <label for="excel-import" class="excel-import">
                        <img src="../assets/img/icon-excel-max.png" alt="Ícone do Excel" class="excel-icon">
                        <span>Clique e suba sua AP</span>
                        <input type="file" id="excel-import" accept="application/" hidden>
                    </label>
                </section>
             </section>
        </section>

    </main>
</body>
</html>

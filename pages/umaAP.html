<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/umaAP.css">
    <title>EnvioAP | Uma AP</title>
</head>
<body>
    <a href="../index.html">sair</a>

    <main>
        <section class="content">
            <section class="header-content"> 
                <span>EnvioAP</span>
                <img src="../assets/img/workon-logo.png" alt="logo workon">
             </section>
 <form class="form-grid">
                <div class="form-group">
                    <label>Empresa</label>
                    <select>
                        <option>Empresa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Competência</label>
                    <input type="text" value="05/2025">
                </div>
                <div class="form-group">
                    <label>Tipo de AP</label>
                    <select>
                        <option>Tipo de AP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data de Vencimento</label>
                    <input type="text" value="10/05/2025">
                </div>
                <div class="form-group">
                    <label>Nº da AP</label>
                    <input type="text" value="123456">
                </div>
                <div class="form-group file-upload">
                    <label class="hidden-label">PDF</label>
                    <label for="pdf-upload" class="pdf-upload">
                        <img src="../assets/img/pdf.png" alt="PDF" class="pdf-icon">
                        <span>Clique e suba sua AP</span>
                        <input type="file" id="pdf-upload" accept="application/pdf" hidden>
                    </label>
                </div>
                <div class="form-group">
                    <label>Nome do Fornecedor</label>
                    <input type="text" value="Umovme">
                </div>
                <div class="form-group">
                    <label>Valor Total</label>
                    <input type="text" value="R$ 10,00">
                </div>
                <div class="form-group">
                    <label>Comentário</label>
                    <select>
                        <option>Escolha o seu comentário</option>
                    </select>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
